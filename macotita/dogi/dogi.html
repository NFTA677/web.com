<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perrito Interactivo</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #dog {
            width: 100px;
            height: 100px;
            background-color: #ffcc00;
            border-radius: 50%;
            position: relative;
            transition: transform 0.2s;
        }
        #dog.jump {
            animation: jump 0.5s forwards;
        }
        @keyframes jump {
            0% { transform: translateY(0); }
            50% { transform: translateY(-100px); }
            100% { transform: translateY(0); }
        }
    </style>
</head>
<body>

<div id="dog"></div>

<script>
    const dog = document.getElementById('dog');

    // Función para mover el perrito
    function moveDog(direction) {
        const currentPosition = dog.getBoundingClientRect();
        if (direction === 'left') {
            dog.style.transform = `translateX(${currentPosition.x - 20}px)`;
        } else if (direction === 'right') {
            dog.style.transform = `translateX(${currentPosition.x + 20}px)`;
        } else if (direction === 'jump') {
            dog.classList.add('jump');
            setTimeout(() => {
                dog.classList.remove('jump');
            }, 500);
        }
    }

    // Función para manejar comandos de voz
    function startListening() {
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'es-ES';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.start();

        recognition.onresult = (event) => {
            const command = event.results[0][0].transcript.toLowerCase();
            console.log('Comando recibido: ', command);
            handleCommand(command);
        };

        recognition.onend = () => {
            recognition.start(); // Reiniciar el reconocimiento
        };
    }

    // Función para manejar los comandos
    function handleCommand(command) {
        if (command.includes('buenos días')) {
            alert('¡Buenos días! 🐶');
        } else if (command.includes('salta')) {
            moveDog('jump');
        } else if (command.includes('izquierda')) {
            moveDog('left');
        } else if (command.includes('derecha')) {
            moveDog('right');
        }
    }

    // Iniciar el reconocimiento de voz
    startListening();
</script>

</body>
</html>

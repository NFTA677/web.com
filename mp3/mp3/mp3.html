<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor MP3 Minimalista</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
        }
        .player {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            padding: 20px;
            text-align: center;
            width: 300px;
        }
        audio {
            width: 100%;
            margin-top: 10px;
        }
        input[type="file"] {
            margin-top: 10px;
        }
        .controls {
            margin-top: 10px;
        }
        .controls button {
            margin: 0 5px;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }
        .controls button:hover {
            background-color: #0056b3;
        }
        .song-name {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="player">
    <h2>Reproductor MP3 Minimalista</h2>
    <input type="file" id="fileInput" accept="audio/mp3" multiple>
    <audio id="audioPlayer" controls></audio>
    <div class="controls">
        <button id="prevBtn">Anterior</button>
        <button id="playPauseBtn">Play</button>
        <button id="nextBtn">Siguiente</button>
        <br>
        <button id="volumeDownBtn">- Volumen</button>
        <button id="volumeUpBtn">+ Volumen</button>
    </div>
    <div class="song-name" id="songName">Nombre de la canción</div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const audioPlayer = document.getElementById('audioPlayer');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const songNameDisplay = document.getElementById('songName');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const volumeUpBtn = document.getElementById('volumeUpBtn');
    const volumeDownBtn = document.getElementById('volumeDownBtn');

    let audioFiles = [];
    let currentTrackIndex = 0;

    fileInput.addEventListener('change', function(event) {
        audioFiles = Array.from(event.target.files);
        if (audioFiles.length > 0) {
            currentTrackIndex = 0;
            loadTrack(currentTrackIndex);
            audioPlayer.play();
            updateSongName();
        }
    });

    function loadTrack(index) {
        const file = audioFiles[index];
        const fileURL = URL.createObjectURL(file);
        audioPlayer.src = fileURL;
        audioPlayer.play();
        updateSongName();
    }

    function updateSongName() {
        if (audioFiles.length > 0) {
            songNameDisplay.textContent = audioFiles[currentTrackIndex].name;
        }
    }

    playPauseBtn.addEventListener('click', function() {
        if (audioPlayer.paused) {
            audioPlayer.play();
            playPauseBtn.textContent = 'Pausa';
        } else {
            audioPlayer.pause();
            playPauseBtn.textContent = 'Play';
        }
    });

    nextBtn.addEventListener('click', function() {
        if (audioFiles.length > 0) {
            currentTrackIndex = (currentTrackIndex + 1) % audioFiles.length;
            loadTrack(currentTrackIndex);
        }
    });

    prevBtn.addEventListener('click', function() {
        if (audioFiles.length > 0) {
            currentTrackIndex = (currentTrackIndex - 1 + audioFiles.length) % audioFiles.length;
            loadTrack(currentTrackIndex);
        }
    });
